<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b2b" />
    <meta
      name="description"
      content="A cinematic procedural ocean and floating navigation buoy rendered with Three.js."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23071b2b%22/><path d=%22M8 37c8-8 16 8 24 0s16 8 24 0v12c-8 8-16-8-24 0S16 41 8 49z%22 fill=%22%232bc7cc%22/><circle cx=%2232%22 cy=%2225%22 r=%227%22 fill=%22%23ff5b32%22/></svg>"
    />
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #04131f; }
      #app { position: relative; }
      #ocean-canvas { opacity: 0; }
      .loader { position: fixed; inset: 0; z-index: 100; background: #04131f; }
    </style>
    <title>Open Water</title>
    <script type="module" crossorigin src="/beautiful-water/pr-preview/pr-12/assets/index-BLR4k6dQ.js"></script>
    <link rel="modulepreload" crossorigin href="/beautiful-water/pr-preview/pr-12/assets/preload-helper-DDWFZvMy.js">
    <link rel="stylesheet" crossorigin href="/beautiful-water/pr-preview/pr-12/assets/index-xtGcCeHc.css">
  </head>
  <body>
    <main id="app">
      <canvas
        id="ocean-canvas"
        aria-label="Animated open ocean with a floating red navigation buoy"
      ></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <button
        type="button"
        class="fps"
        data-performance-panel
        aria-label="Rendering performance. Click to copy the last 15 seconds of diagnostics."
        title="Click to copy a 15-second performance report"
      >
        <strong><b data-gpu-p50>--</b><i> ms</i></strong>
        <span>GPU PASS / 10S P50</span>
        <small>P95 <b data-gpu-p95>--</b> ms / <b data-fps>--</b> FPS</small>
        <span class="fps__history-label">PRESENTED FPS / LAST 15S</span>
        <svg
          class="fps__history"
          data-fps-history
          viewBox="0 0 160 34"
          preserveAspectRatio="none"
          role="img"
          aria-label="Presented FPS history is collecting"
        >
          <line class="fps__history-grid" x1="0" y1="1" x2="160" y2="1"></line>
          <line class="fps__history-grid" x1="0" y1="17" x2="160" y2="17"></line>
          <path class="fps__history-line" data-fps-history-line d=""></path>
        </svg>
        <small class="fps__history-summary">
          <b data-fps-average>--</b> AVG / <b data-fps-low>--</b> 1% LOW
        </small>
        <span class="fps__copy" data-performance-copy aria-live="polite">
          CLICK TO COPY 15S REPORT
        </span>
      </button>
      <div class="renderer-toggle" data-renderer-toggle hidden>
        <span class="renderer-toggle__status" data-renderer-status></span>
        <div class="renderer-toggle__buttons" role="group" aria-label="Graphics renderer">
          <button type="button" data-renderer-mode="webgpu" aria-pressed="false">WebGPU</button>
          <button type="button" data-renderer-mode="webgl" aria-pressed="false">WebGL</button>
        </div>
      </div>
      <div class="loader" role="status" aria-live="polite" aria-label="Loading ocean simulation">
        <div class="loader__visual" aria-hidden="true">
          <span class="loader__sun"></span>
          <div class="loader__horizon">
            <span class="loader__wave"></span>
            <span class="loader__wave"></span>
            <span class="loader__wave"></span>
          </div>
          <span class="loader__buoy"></span>
        </div>
        <strong class="loader__title">Open Water</strong>
        <span class="loader__status">Preparing simulation</span>
        <span class="loader__progress" aria-hidden="true">
          <span class="loader__progress-bar"></span>
        </span>
      </div>
      <noscript>This scene needs JavaScript and WebGPU or WebGL 2 enabled.</noscript>
    </main>
  </body>
</html>
